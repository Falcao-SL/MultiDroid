# Site do MultiDroid — configuração do nginx dentro do contêiner.

server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    include /etc/nginx/snippets/multidroid-security-headers.conf;

    gzip on;
    gzip_types text/plain text/css application/javascript application/xml
               image/svg+xml application/manifest+json;
    gzip_min_length 1024;

    # Os nomes de arquivo não carregam hash de conteúdo: "immutable" só vale
    # porque um asset novo significa uma imagem nova, reconstruída do zero.
    # Cache-Control sem `always`: só vale para respostas de sucesso. Com `always`,
    # um 404 pedido antes do deploy terminar ficava um ano no cache do Cloudflare.
    location /assets/ {
        include /etc/nginx/snippets/multidroid-security-headers.conf;
        add_header Cache-Control "public, max-age=31536000, immutable";
    }

    # O .dmg fica no GitHub Releases; o site só aponta para lá.

    # Uma hora na página: curto o bastante para uma correção de texto aparecer
    # no mesmo dia, longo o bastante para o CDN absorver um pico.
    location = / {
        include /etc/nginx/snippets/multidroid-security-headers.conf;
        add_header Cache-Control "public, max-age=3600";
        try_files /index.html =404;
    }

    location / {
        try_files $uri $uri/ =404;
    }
}
