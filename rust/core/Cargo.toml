[package]
name = "multidroid-core"
description = "Núcleo do MultiDroid: catálogo, instalador, aparelhos, emulador e estado, sem interface"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
roxmltree = "0.20"
sha1 = "0.10"
ureq = "2"
zip = { version = "2", default-features = false, features = ["deflate"] }

[dev-dependencies]
tempfile = "3"
