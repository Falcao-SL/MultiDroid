[package]
name = "multidroid"
description = "MultiDroid: vários aparelhos Android numa mesa só, no Mac, no Windows e no Linux"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true

[dependencies]
multidroid-core = { path = "../core" }
# unstable-winit-030: abrir a janela centralizada (main.rs, centralizar).
slint = { version = "1", features = ["unstable-winit-030"] }
sys-locale = "0.3"
tokio = { version = "1", features = ["rt-multi-thread", "time"] }

[dev-dependencies]
png = "0.17"

[build-dependencies]
slint-build = "1"

[target.'cfg(windows)'.build-dependencies]
winresource = "0.1"

# Pacotes de cada sistema, gerados pelo cargo-packager no workflow release.yml
# (docs/spec/MULTIPLATAFORMA.md §6). Enquanto a versão Rust não alcança a 0.2,
# sai como "MultiDroid Preview", com outro identificador, para não substituir o
# app SwiftUI instalado.
[package.metadata.packager]
product-name = "MultiDroid Preview"
identifier = "com.falcaosl.multidroid.preview"
publisher = "Falcao SL"
# Vira o "Maintainer" do .deb (sem ele o dpkg reclama ao instalar).
authors = ["Falcao SL"]
copyright = "© 2026 Falcao SL"
category = "DeveloperTool"
homepage = "https://multidroid.falcaosl.com"
description = "Vários aparelhos Android numa mesa só."
before-packaging-command = "cargo build --release -p multidroid"
out-dir = "../target/packages"
binaries = [{ path = "multidroid", main = true }]
binaries-dir = "../target/release"
icons = ["icons/icon.ico", "icons/icon.icns", "icons/32x32.png", "icons/48x48.png", "icons/64x64.png", "icons/128x128.png", "icons/256x256.png", "icons/512x512.png"]

[package.metadata.packager.macos]
minimum-system-version = "13.0"

[package.metadata.packager.deb]
depends = ["libfontconfig1", "libxkbcommon0"]

# .rpm (Fedora, openSUSE, RHEL) pelo cargo-generate-rpm, que o cargo-packager não
# gera: os mesmos arquivos do .deb (binário, atalho e ícones).
[package.metadata.generate-rpm]
name = "multidroid-preview"
summary = "Vários aparelhos Android numa mesa só."
url = "https://multidroid.falcaosl.com"
# As dependências automáticas vêm do ldd da máquina de build (Debian) e trazem
# nomes que o Fedora não tem (libbz2.so.1.0); o binário só pede as de baixo.
auto-req = "no"
assets = [
    { source = "target/release/multidroid", dest = "/usr/bin/multidroid", mode = "755" },
    { source = "packaging/multidroid.desktop", dest = "/usr/share/applications/multidroid.desktop", mode = "644" },
    { source = "icons/32x32.png", dest = "/usr/share/icons/hicolor/32x32/apps/multidroid.png", mode = "644" },
    { source = "icons/48x48.png", dest = "/usr/share/icons/hicolor/48x48/apps/multidroid.png", mode = "644" },
    { source = "icons/64x64.png", dest = "/usr/share/icons/hicolor/64x64/apps/multidroid.png", mode = "644" },
    { source = "icons/128x128.png", dest = "/usr/share/icons/hicolor/128x128/apps/multidroid.png", mode = "644" },
    { source = "icons/256x256.png", dest = "/usr/share/icons/hicolor/256x256/apps/multidroid.png", mode = "644" },
    { source = "icons/512x512.png", dest = "/usr/share/icons/hicolor/512x512/apps/multidroid.png", mode = "644" },
]

[package.metadata.generate-rpm.requires]
fontconfig = "*"
libxkbcommon = "*"
"libstdc++" = "*"

[package.metadata.packager.nsis]
installer-mode = "currentUser"
