# Versão Rust do MultiDroid nos três sistemas (docs/spec/MULTIPLATAFORMA.md §6):
# formata, analisa, testa e compila no macOS, no Windows e no Linux a cada push
# que mexe em rust/ ou nos tokens de design. O app SwiftUI (mac/) não passa aqui
# — ver swift-mac.yml.
name: rust

on:
  push:
    branches: [main]
    paths: ["rust/**", "docs/design/tokens.json", ".github/workflows/rust.yml"]
  pull_request:
    paths: ["rust/**", "docs/design/tokens.json", ".github/workflows/rust.yml"]
  workflow_dispatch:
    inputs:
      emulador_macos:
        description: "Tentar emulador_real no macOS (Hypervisor; lento; continue-on-error)"
        type: boolean
        default: false
      emulador_windows:
        description: "Tentar emulador_real no Windows (só útil com runner WHPX/self-hosted)"
        type: boolean
        default: false

permissions:
  contents: read

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        os: [macos-latest, windows-latest, ubuntu-latest]
    runs-on: ${{ matrix.os }}
    defaults:
      run:
        working-directory: rust
    steps:
      - uses: actions/checkout@v7
      - name: Bibliotecas do Slint no Linux
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y libfontconfig1-dev libxkbcommon-dev libwayland-dev libx11-dev libxcursor-dev libxrandr-dev libxi-dev libgl1-mesa-dev
      # O núcleo C (rust/native) entra no binário pelo build.rs. O runner já
      # traz o CMake; sem ele o build.rs cai no compilador C direto, o mesmo código.
      - name: CMake do núcleo nativo
        run: cmake --version
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: rust
      - run: cargo fmt --all --check
      - run: cargo clippy --all-targets -- -D warnings
      - run: cargo test
      - run: cargo build --release
      - uses: actions/upload-artifact@v7
        with:
          name: multidroid-${{ runner.os }}
          path: |
            rust/target/release/multidroid
            rust/target/release/multidroid.exe
          if-no-files-found: error

  # Etapa R-3: liga um aparelho de verdade no Linux x86_64, com KVM, e testa
  # boot, pausa, captura e desligar salvando (core/tests/emulador_real.rs).
  emulador-linux:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    defaults:
      run:
        working-directory: rust
    env:
      MULTIDROID_GPU: swiftshader_indirect
      MULTIDROID_SDK: ${{ github.workspace }}/sdk
    steps:
      - uses: actions/checkout@v7
      - name: KVM para o emulador
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
          ls -l /dev/kvm
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: rust
      # Emulador e imagem AOSP 33 x86_64 (~1,5 GB) baixados uma vez e guardados.
      - uses: actions/cache@v5
        with:
          path: sdk
          key: sdk-linux-emulador-aosp33-v1
      - run: cargo test -p multidroid-core --test emulador_real -- --ignored --nocapture

  # macOS: o job sempre aparece no gráfico (nada de "skipped"). A suíte
  # emulador_real (~3 GB + boot) só sob workflow_dispatch / var — Hypervisor
  # existe, mas tempo e disco estouram nos runners hospedados. continue-on-error
  # evita vermelhar o workflow se a suíte opt-in falhar.
  emulador-macos:
    runs-on: macos-latest
    timeout-minutes: 60
    continue-on-error: true
    defaults:
      run:
        working-directory: rust
    env:
      MULTIDROID_GPU: swiftshader_indirect
      MULTIDROID_SDK: ${{ github.workspace }}/sdk
    steps:
      - uses: actions/checkout@v7
      - name: Opt-in da suíte pesada
        run: |
          want=0
          if [[ "${{ github.event_name }}" == "workflow_dispatch" && "${{ inputs.emulador_macos }}" == "true" ]]; then
            want=1
          elif [[ "${{ vars.MULTIDROID_MACOS_EMULATOR }}" == "true" ]]; then
            want=1
          fi
          if [[ "$want" != "1" ]]; then
            echo "::notice::emulador_real macOS: opt-in (Actions → rust → Run workflow com emulador_macos, ou var MULTIDROID_MACOS_EMULATOR). Job ok; a suíte pesada não rodou. Linux cobre R-3 no CI."
            echo "run=0" >>"$GITHUB_ENV"
            exit 0
          fi
          if ! sysctl -n kern.hv_support 2>/dev/null | grep -q 1; then
            echo "::warning::Hypervisor indisponível neste runner — suíte não rodou."
            echo "run=0" >>"$GITHUB_ENV"
            exit 0
          fi
          echo "ok: kern.hv_support=1"
          echo "run=1" >>"$GITHUB_ENV"
      - uses: dtolnay/rust-toolchain@stable
        if: env.run == '1'
      - uses: Swatinem/rust-cache@v2
        if: env.run == '1'
        with:
          workspaces: rust
      - uses: actions/cache@v5
        if: env.run == '1'
        with:
          path: sdk
          key: sdk-macos-emulador-aosp33-v1
      - name: emulador_real
        if: env.run == '1'
        run: cargo test -p multidroid-core --test emulador_real -- --ignored --nocapture

  # Windows: sempre no gráfico. Runners hospedados quase nunca têm WHPX;
  # a suíte só sob pedido / var / self-hosted. Sem capacidade: notice e sucesso.
  emulador-windows:
    runs-on: windows-latest
    timeout-minutes: 60
    continue-on-error: true
    defaults:
      run:
        working-directory: rust
    env:
      MULTIDROID_GPU: swiftshader_indirect
      MULTIDROID_SDK: ${{ github.workspace }}/sdk
    steps:
      - uses: actions/checkout@v7
      - name: Opt-in e WHPX
        shell: pwsh
        run: |
          $want = $false
          if ($env:GITHUB_EVENT_NAME -eq 'workflow_dispatch' -and '${{ inputs.emulador_windows }}' -eq 'true') { $want = $true }
          if ('${{ vars.MULTIDROID_WINDOWS_EMULATOR }}' -eq 'true') { $want = $true }
          if (-not $want) {
            Write-Host "::notice::emulador_real Windows: opt-in (workflow_dispatch com emulador_windows, ou var MULTIDROID_WINDOWS_EMULATOR / self-hosted). Job ok; a suíte não rodou. Linux cobre R-3 no CI."
            "run=0" | Out-File -FilePath $env:GITHUB_ENV -Append -Encoding utf8
            exit 0
          }
          $ok = $false
          try {
            $feat = Get-WindowsOptionalFeature -Online -FeatureName HypervisorPlatform -ErrorAction SilentlyContinue
            if ($feat -and $feat.State -eq 'Enabled') { $ok = $true }
          } catch {}
          if (-not $ok) {
            if (Get-Service vmcompute -ErrorAction SilentlyContinue) { $ok = $true }
          }
          if (-not $ok) {
            Write-Host "::notice::Sem WHPX confiável neste runner. Use self-hosted com Plataforma de Hipervisor, ou teste em PC nativo (MULTIPLATAFORMA.md §4). Job ok sem a suíte."
            "run=0" | Out-File -FilePath $env:GITHUB_ENV -Append -Encoding utf8
            exit 0
          }
          Write-Host "ok: indício de WHPX/Hyper-V"
          "run=1" | Out-File -FilePath $env:GITHUB_ENV -Append -Encoding utf8
      - uses: dtolnay/rust-toolchain@stable
        if: env.run == '1'
      - uses: Swatinem/rust-cache@v2
        if: env.run == '1'
        with:
          workspaces: rust
      - uses: actions/cache@v5
        if: env.run == '1'
        with:
          path: sdk
          key: sdk-windows-emulador-aosp33-v1
      - name: emulador_real
        if: env.run == '1'
        shell: bash
        run: cargo test -p multidroid-core --test emulador_real -- --ignored --nocapture

  # Etapa R-6: motor leve no Linux x86_64. Liga um Android em Redroid (Docker,
  # binder do kernel), mostra a tela pelo scrcpy e guarda os dados
  # (core/tests/leve_real.rs).
  leve-linux:
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    defaults:
      run:
        working-directory: rust
    env:
      MULTIDROID_SDK: ${{ github.workspace }}/sdk-leve
    steps:
      - uses: actions/checkout@v7
      - name: binder no kernel
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq "linux-modules-extra-$(uname -r)" || true
          sudo modprobe binder_linux devices=binder,hwbinder,vndbinder
          lsmod | grep binder
      - run: docker pull -q redroid/redroid:13.0.0_64only-latest
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: rust
      - run: cargo test -p multidroid-core --test leve_real -- --ignored --nocapture --test-threads 1
