# DEPRECATED as a tag-triggered release path.
# Production releases (native Mac 0.2.x and Rust Preview 0.3.x) go through
# release.yml, which builds every supported platform, publishes the GitHub
# Release, then sync-site-on-release.yml updates multidroid.falcaosl.com.
#
# Kept only for emergency workflow_dispatch QA of a Swift .dmg on a
# GitHub-hosted macOS runner (ad hoc or secrets-based signing). Does not
# publish a release or touch the site.

name: release-swift (QA only)

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  dmg:
    runs-on: macos-latest
    env:
      HAS_SIGNING: ${{ secrets.APPLE_CERTIFICATE_P12 != '' }}
      HAS_NOTARY: ${{ secrets.APPLE_API_KEY != '' }}
      DEVELOPER_DIR: /Applications/Xcode.app/Contents/Developer
    steps:
      - uses: actions/checkout@v7
      - name: Point to the unified release pipeline
        run: |
          echo "::notice::For production, push a v* tag (or Run workflow on 'Release signed installers'). This job only builds a QA .dmg artifact."
      - name: Xcode
        run: xcodebuild -version && swift --version
      - name: Importa Developer ID
        if: env.HAS_SIGNING == 'true'
        env:
          APPLE_CERTIFICATE_P12: ${{ secrets.APPLE_CERTIFICATE_P12 }}
          APPLE_CERTIFICATE_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
          APPLE_SIGN_IDENTITY: ${{ secrets.APPLE_SIGN_IDENTITY }}
        run: |
          chmod +x scripts/ci/import-apple-cert.sh
          scripts/ci/import-apple-cert.sh
      - name: Sem certificado — aviso
        if: env.HAS_SIGNING != 'true'
        run: |
          echo "::notice::APPLE_CERTIFICATE_P12 ausente — .dmg ad hoc (só abre neste Mac / Gatekeeper avisa)."
          echo "HAS_SIGNING=false" >>"$GITHUB_ENV"
      - name: Compila e monta o .dmg
        working-directory: mac
        env:
          NOTARIZE: "0"
        run: |
          chmod +x scripts/build-app.sh scripts/release.sh
          if [ "${HAS_SIGNING}" = "true" ] && [ -n "${APPLE_SIGN_IDENTITY:-}" ]; then
            export SIGN_ID="$APPLE_SIGN_IDENTITY"
            scripts/release.sh
          else
            SIGN_ID=- scripts/build-app.sh release
            APP=build/MultiDroid.app
            VERSION=$(/usr/libexec/PlistBuddy -c "Print CFBundleShortVersionString" "$APP/Contents/Info.plist")
            DMG=build/MultiDroid-$VERSION.dmg
            WORK=$(mktemp -d)
            MB=$(( $(du -sm "$APP" | cut -f1) + 40 ))
            hdiutil create -size "${MB}m" -fs APFS -volname MultiDroid "$WORK/rw.dmg" >/dev/null 2>&1
            mkdir "$WORK/mnt"
            hdiutil attach "$WORK/rw.dmg" -mountpoint "$WORK/mnt" -nobrowse -quiet
            ditto "$APP" "$WORK/mnt/MultiDroid.app"
            ln -s /Applications "$WORK/mnt/Applications"
            hdiutil detach "$WORK/mnt" -quiet || hdiutil detach "$WORK/mnt" -force -quiet
            rm -f "$DMG"
            hdiutil convert "$WORK/rw.dmg" -format ULFO -o "$DMG" >/dev/null
            rm -rf "$WORK"
            echo "ok: $DMG (ad hoc)"
          fi
          ls -la build/*.dmg
      - name: Notariza
        if: env.HAS_SIGNING == 'true' && env.HAS_NOTARY == 'true'
        env:
          APPLE_API_KEY: ${{ secrets.APPLE_API_KEY }}
          APPLE_API_KEY_ID: ${{ secrets.APPLE_API_KEY_ID }}
          APPLE_API_ISSUER: ${{ secrets.APPLE_API_ISSUER }}
        run: |
          chmod +x scripts/ci/notarize.sh
          DMG=$(ls mac/build/MultiDroid-*.dmg | head -1)
          scripts/ci/notarize.sh "$DMG"
      - name: Nome do artefato
        id: out
        run: |
          SRC=$(ls mac/build/MultiDroid-*.dmg | head -1)
          VERSION=$(/usr/libexec/PlistBuddy -c "Print CFBundleShortVersionString" mac/build/MultiDroid.app/Contents/Info.plist)
          DEST="MultiDroid-${VERSION}-QA.dmg"
          mkdir -p out
          cp "$SRC" "out/$DEST"
          echo "file=$DEST" >>"$GITHUB_OUTPUT"
          ls -la out/
      - uses: actions/upload-artifact@v7
        with:
          name: MultiDroid-swift-dmg-qa
          path: out/*
          if-no-files-found: error
